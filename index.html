    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#f3ede3" />
    <meta name="description" content="ХРУСТ — кафе-пекарня. Меню, контакты и заказ." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

      rel="stylesheet"
    />
    <title>ХРУСТ — кафе-пекарня</title>
    <!--
      Samsung Internet и другие браузеры с «тёмным режимом для сайтов» не перекрашивают страницу,
      если у неё есть своя тёмная тема. Правило стоит прямо здесь, чтобы браузер увидел его сразу при загрузке,
      ещё до основных стилей. В тёмной теме — те же бежевые цвета: дизайн одинаковый у всех.
    -->
    <style>
      :root { color-scheme: light dark; }
      html, body { background: #f3ede3 !important; color: #222820 !important; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: light dark; }
        html, body { background: #f3ede3 !important; color: #222820 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
